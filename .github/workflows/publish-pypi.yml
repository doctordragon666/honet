# 定时发布：每周检查一次，若 pyproject.toml 里的版本（稳定版）在 PyPI 上还不存在，
# 就跑测试、构建并发布；已存在或属于预发布通道时直接跳过。
#
# 认证使用 PyPI Trusted Publishing（OIDC），仓库与 GitHub Secrets 里都不保存 token。
# 首次启用前需在 PyPI 配置 pending publisher，步骤见 docs/PUBLISHING.md 第 10 节。
name: Scheduled PyPI Release

on:
  schedule:
    # 每周一 03:00 UTC（北京时间 11:00）
    - cron: "0 3 * * 1"
  # 允许在 Actions 页面手动触发（例如刚改完版本号，不想等下一次定时）
  workflow_dispatch:

concurrency:
  group: pypi-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: 发布 honet 到 PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/honet/
    permissions:
      contents: read
      id-token: write # Trusted Publishing 用 OIDC 换取短期上传凭据
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 读取版本号
        id: version
        run: echo "value=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: 判断发布通道
        id: channel
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # 预发布版本（dev / a / b / rc）按发布策略只发 TestPyPI，本工作流跳过
          if [[ "$VERSION" =~ (a|b|rc)[0-9]+ ]] || [[ "$VERSION" =~ \.dev[0-9]+$ ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$VERSION 是预发布版本，按策略只发 TestPyPI，本次跳过。"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 检查 PyPI 是否已有该版本
        id: exists
        if: steps.channel.outputs.stable == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if curl -fsS "https://pypi.org/pypi/honet/${VERSION}/json" > /dev/null; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PyPI 上已存在 ${VERSION}，跳过发布。"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装开发依赖
        if: steps.channel.outputs.stable == 'true' && steps.exists.outputs.value == 'false'
        run: uv sync --group dev

      - name: 运行测试
        if: steps.channel.outputs.stable == 'true' && steps.exists.outputs.value == 'false'
        run: uv run pytest -q

      - name: 静态检查
        if: steps.channel.outputs.stable == 'true' && steps.exists.outputs.value == 'false'
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: 构建并校验分发包
        if: steps.channel.outputs.stable == 'true' && steps.exists.outputs.value == 'false'
        run: |
          uv build
          uvx twine check dist/*

      # 上传前先验证 OIDC 能否换到 PyPI token。
      # 换不到时（最常见是 PyPI 侧没配 trusted publisher，报 invalid-publisher），
      # 在 gh-action-pypi-publish 里只会在 Docker 日志深处留一行英文，
      # 很难判断该改哪里。这里提前失败，并把「该去哪、填什么」直接打出来。
      - name: 预检 Trusted Publishing 配置
        if: steps.channel.outputs.stable == 'true' && steps.exists.outputs.value == 'false'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -uo pipefail
          # 向 PyPI 的 OIDC token 端点换票；不打印 token 本身。
          body=$(curl -sS -X POST \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi" 2>&1) || true
          token=$(printf '%s' "$body" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')

          if [ -n "$token" ]; then
            echo "::notice::OIDC 换票成功，可以上传 ${VERSION}。"
            exit 0
          fi

          echo "::error title=PyPI Trusted Publishing 未配置::OIDC 换票失败，PyPI 侧没有匹配的 trusted publisher。"
          cat <<'EOF'

          ────────────────────────────────────────────────────────────────
          需要在 PyPI 上为本项目配置 trusted publisher（只需一次）：

            1. 打开 https://pypi.org/manage/project/honet/settings/publishing/
            2. 点 "Add a new pending publisher"（GitHub 标签页）
            3. 按下面这些值填写（必须完全一致，区分大小写）：

                 Owner             doctordragon666
                 Repository name   honet
                 Workflow name     publish-pypi.yml
                 Environment name  pypi

          填错任一项都会得到 invalid-publisher。配好后再重跑本工作流即可。
          ────────────────────────────────────────────────────────────────

          PyPI 原始响应：
          EOF
          printf '%s\n' "$body"
          exit 1

      - name: 上传到 PyPI
        if: steps.channel.outputs.stable == 'true' && steps.exists.outputs.value == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
