[project]
name = "honet"
version = "0.1.1"
description = "Lightweight toolkit for modelling and analysing higher-order networks (hypergraphs)."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "DoctorDragon", email = "river_stream@petalmail.com" },
]
maintainers = [
    { name = "DoctorDragon", email = "river_stream@petalmail.com" },
]
keywords = [
    "higher-order-networks",
    "hypergraph",
    "complex-systems",
    "network-science",
    "incidence-matrix",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.optional-dependencies]
# 可选：Hypergraph.from_dataframe 直接接收 pandas DataFrame；核心逻辑不 import pandas
pandas = [
    "pandas>=2.0",
]
# 分析功能（构建 / 指标 / 社区 / 传播 / 攻击 / 导入导出）的可选依赖。
# 核心容器（Hypergraph 等）零依赖；只有访问 honet 的分析子包时才需要这些包。
analysis = [
    "hypernetx>=2.4.3",
    "networkx>=3.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    # honet.convert 的 xgi / hypergraphx 互转，以及 honet.metrics 的可约性指标
    "xgi>=0.9",
    "hypergraphx>=1.7",
]
# 绘图功能（honet.plot）额外需要 matplotlib；honet.io.load_map_data 需要 geopandas。
viz = [
    "honet[analysis]",
    "matplotlib>=3.8",
    "geopandas>=0.14",
]
# 表格读写：honet.export 的 .xlsx 往返需要 openpyxl。
excel = [
    "openpyxl>=3.1",
]
# 驱动节点控制（honet.control）需要 Hypergraph Analysis Toolbox。
# 注意：PyPI 上名为 hat 的包是无关的 Theano 工具箱，真正的包名是
# HypergraphAnalysisToolbox，导入名为 HAT。
hat = [
    "honet[analysis]",
    "HypergraphAnalysisToolbox>=1.1.18",
]
# 一次装齐全部可选功能。
all = [
    "honet[analysis]",
    "honet[viz]",
    "honet[excel]",
    "honet[hat]",
]

[project.urls]
Homepage = "https://github.com/doctordragon666/honet"
Repository = "https://github.com/doctordragon666/honet"
Documentation = "https://github.com/doctordragon666/honet/blob/main/README.md"
Changelog = "https://github.com/doctordragon666/honet/blob/main/CHANGELOG.md"
Issues = "https://github.com/doctordragon666/honet/issues"

[dependency-groups]
# 开发期依赖：只用于测试与静态检查，不会进入发布到 PyPI 的运行依赖
dev = [
    "pandas>=2.0",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# sdist 额外收录的仓库根文件（默认只收 src 模块 + pyproject.toml + README.md + LICENSE）。
# CHANGELOG.md 是发布溯源的关键文档，必须随 sdist 分发，便于下游审计变更；
# wheel 只包含 honet/ 模块（+ py.typed），不重复收录文档。
source-include = ["CHANGELOG.md"]

[tool.ruff]
# 目标 Python 版本与 requires-python 保持一致
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# 不对 Markdown 中的示例代码块做重排：README/PUBLISHING 里的注释是对齐排版，
# 交给 ruff format 会挤掉空白，反而降低可读性
extend-exclude = ["*.md", "docs"]

[tool.ruff.lint]
# E/W: pycodestyle  E/F: pyflakes  I: isort  UP: pyupgrade  B: bugbear
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["honet"]

[tool.pytest.ini_options]
# tests 目录无需手工加入 sys.path：包以可编辑模式安装进虚拟环境
testpaths = ["tests"]
addopts = "-ra --strict-markers"
